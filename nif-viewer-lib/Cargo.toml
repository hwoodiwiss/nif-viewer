[package]
name = "nif-viewer-lib"
version = "0.1.0"
authors = ["Hugo Woodiwiss <hj.woodiwiss@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nif-scene = { path = "../nif-scene", version = "0.1.0" }
scene-types = { path = "../scene-types", version = "0.1.0" }
scene-renderer = { path = "../scene-renderer", version = "0.1.0" }
scene-viewer = { path = "../scene-viewer", version = "0.1.0" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4"
futures = "0.3"
anyhow = "1.0"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.64"
js-sys = "0.3.74"
web-sys = { version = "0.3.72", features = [
	"Blob",
	"BlobPropertyBag",
	"Document",
	"Element",
	"HtmlAnchorElement",
	"HtmlCanvasElement",
	"HtmlElement",
	"Node",
	"Url",
	"Window",
] }
console_error_panic_hook = "0.1.6"
console_log = "1"
# getrandom 0.2 / 0.3 wasm backends, in case transitive dependencies pull them in
# (getrandom 0.3 also needs the getrandom_backend="wasm_js" rustflag in .cargo/config.toml)
getrandom = { version = "0.2.17", features = ["js"] }
getrandom3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[lib]
crate-type = ["cdylib", "rlib"]

