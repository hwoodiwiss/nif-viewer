[package]
name = "scene-renderer"
version = "0.1.0"
authors = ["Hugo Woodiwiss <hj.woodiwiss@gmail.com>"]
edition = "2018"
description = "wgpu renderer for scene-types scenes: GPU resources, built-in shading profiles and readback."
license = "MIT"
include = ["src/**", "shaders/**", "Cargo.toml"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.64"

[dependencies]
scene-types = { path = "../scene-types", version = "0.1.0" }
wgpu = { version = "29.0.0", features = ["std"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
log = "0.4"
futures = "0.3"
half = "2"
serde_json = "1"
thiserror = "2"
